name: Update scores

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update-and-knit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::readxl
            any::kableExtra
            any::ggplot2
            any::reshape2
            any::gtools
            any::dplyr
            any::tidyr
            any::ggrepel
            any::jsonlite

      - name: Poll feed and update results_2026.csv
        run: Rscript update_results_2026.R

      - name: Knit scores.Rmd
        env:
          TZ: Australia/Sydney
        run: Rscript -e 'rmarkdown::render("scores.Rmd")'

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_2026.csv scores.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update results and scores ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
